name: CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t covenant-code-landing-service:ci .

  test:
    name: Run tests (Maven)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          ./mvnw -B test

  deploy:
    name: Deploy (Docker Compose over SSH)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name =='develop')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.148.228.65
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            # 1) обновляем код на сервере
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              mkdir -p "${{ secrets.DEPLOY_PATH }}"
              git clone https://github.com/${{ github.repository }}.git "${{ secrets.DEPLOY_PATH }}"
            fi

            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 2) пересобираем/поднимаем контейнеры
            docker compose pull || true
            docker compose up -d --build

            # 3) чистим старые образы (по желанию)
            docker image prune -f
